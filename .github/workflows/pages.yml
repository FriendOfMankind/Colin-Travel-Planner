# The website on GitHub Pages: build site/ from the files on every push to
# main and publish it. Needs Settings → Pages → Source: "GitHub Actions"
# (once). The claude.ai page is published separately and is unaffected.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, but never cancels
# a deploy already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: node tools/build.mjs
        env: { TZ: America/New_York }
      # Publish the built files only, not the page's source.
      - run: rm -rf site/src site/packs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

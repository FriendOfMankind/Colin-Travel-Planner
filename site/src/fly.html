<title>__TITLE__ Flythrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen terrain view; the day's name top left, transport along the bottom, the day list in a drawer.
   Tokens are the trip site's own (site/src/app.css), plus a relief ramp for the terrain. */
:root {
  --paper: #f4f6f3; --surface: #ffffff; --ink: #1b2220; --ink-2: #3c4642; --muted: #5f6a65; --line: #dce1db;
  --accent: #2e6a4f; --accent-ink: #ffffff; --today: #e4b02e; --water: #2c5e8c;
  --sky: #dfe7e2; --contour: #24302b;
  --r0: #a9b89a; --r1: #5f7f5c; --r2: #b0a47c; --r3: #8d857a; --r4: #f1f0ea; --sea: #86a9c2;
  --route-rest: #1b2220;
  --display: "Avenir Next Condensed", "Roboto Condensed", sans-serif-condensed, "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, "Roboto Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #111614; --surface: #19201d; --ink: #e6ebe7; --ink-2: #c3cbc6; --muted: #93a09a; --line: #2a332f;
    --accent: #72c29a; --accent-ink: #0d1a14; --today: #f0c24b; --water: #7fb2e0;
    --sky: #0f1513; --contour: #050807;
    --r0: #2b3a30; --r1: #24402f; --r2: #4a4634; --r3: #55514b; --r4: #c9cdc8; --sea: #17303f;
    --route-rest: #e6ebe7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #111614; --surface: #19201d; --ink: #e6ebe7; --ink-2: #c3cbc6; --muted: #93a09a; --line: #2a332f;
  --accent: #72c29a; --accent-ink: #0d1a14; --today: #f0c24b; --water: #7fb2e0;
  --sky: #0f1513; --contour: #050807;
  --r0: #2b3a30; --r1: #24402f; --r2: #4a4634; --r3: #55514b; --r4: #c9cdc8; --sea: #17303f;
  --route-rest: #e6ebe7;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.head { position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.name { min-width: 0; text-shadow: 0 0 12px var(--sky), 0 0 4px var(--sky); }
.eyebrow { font: 600 12px/1.2 var(--display); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
h1 { font: 700 clamp(26px, 5vw, 44px)/1.05 var(--display); letter-spacing: .01em; margin: 2px 0 4px; text-wrap: balance; }
.meta { font: 13px/1.3 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.btn { pointer-events: auto; font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--muted); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.transport { display: flex; gap: 6px; }
.transport .btn { width: 44px; padding: 0; display: grid; place-items: center; }
.transport .btn svg { width: 18px; height: 18px; fill: currentColor; }
#play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scrub { position: relative; height: 44px; min-width: 0; }
#profile { position: absolute; inset: 0; width: 100%; height: 100%; }
#seek { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.read { display: flex; gap: 10px; align-items: center; }
#now { font: 13px/1.2 var(--mono); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 620px) {
  .bar { grid-template-columns: 1fr auto; }
  .scrub { grid-column: 1 / -1; grid-row: 1; }
}

.label { position: fixed; left: 0; top: 0; pointer-events: none; font: 600 12px/1 var(--display); letter-spacing: .04em;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; white-space: nowrap;
  transform: translate(-50%, -100%); will-change: transform; }
.label.camp { border-color: var(--today); }

#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 88vw); background: var(--surface); border-left: 1px solid var(--line);
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; z-index: 5; }
#drawer header { display: flex; justify-content: space-between; align-items: center; }
#drawer h2 { font: 600 20px/1.1 var(--display); margin: 0; }
#days { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
#days button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink);
  padding: 9px 4px; cursor: pointer; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 8px; align-items: baseline; font: 14px/1.3 var(--body); }
#days button:hover { background: var(--paper); }
#days button[aria-current="true"] { box-shadow: inset 3px 0 0 var(--today); background: var(--paper); }
#days .d { font: 12px/1.3 var(--mono); color: var(--muted); }
#days .mi { font: 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.credit { font-size: 12px; line-height: 1.4; color: var(--muted); margin: 0; }
#fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--paper); }
</style>

<div id="stage" aria-label="3D terrain view of the day's route"></div>

<div class="head">

</div>

<div class="bar">
  <div class="transport">
    <button class="btn" id="prev" type="button" aria-label="Previous day"><svg viewBox="0 0 20 20"><path d="M4 3h2v14H4zM17 3v14L7 10z"/></svg></button>
    <button class="btn" id="play" type="button" aria-label="Play"><svg viewBox="0 0 20 20"><path id="playIcon" d="M5 3l12 7-12 7z"/></svg></button>
    <button class="btn" id="next" type="button" aria-label="Next day"><svg viewBox="0 0 20 20"><path d="M14 3h2v14h-2zM3 3v14l10-7z"/></svg></button>
  </div>

    <canvas id="profile"></canvas>

</div>

</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA = __DATA__;
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const KM_LAT = 110.574, MI = 0.621371, FT = 3.28084;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  if (!window.THREE) { $("fail").hidden = false; return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch { $("fail").hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  $("stage").appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, 0.05, 4000);
  scene.fog = new THREE.Fog(0xffffff, 10, 100);

  // The list: an overview first, then each day that has a line.
  const items = [{ overview: true, title: "The whole route", grid: DATA.overview.grid, pins: DATA.overview.pins }, ...DATA.days];
  const totalKm = DATA.days.reduce((s, d) => s + d.km, 0);

  // ---- terrain ----------------------------------------------------------
  function decode(g) {
    const bin = atob(g.b64), q = new Uint16Array(bin.length / 2), h = new Float32Array(q.length);
    for (let i = 0; i < q.length; i++) q[i] = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    const k = (g.max - g.min) / 65535;
    for (let i = 0; i < h.length; i++) h[i] = g.min + q[i] * k;
    return h;
  }
  const terrainMat = new THREE.ShaderMaterial({
    extensions: { derivatives: true },
    uniforms: {
      c0: { value: new THREE.Color() }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() }, c3: { value: new THREE.Color() }, c4: { value: new THREE.Color() },
      cSea: { value: new THREE.Color() }, cInk: { value: new THREE.Color() }, cFog: { value: new THREE.Color() },
      uInt: { value: 100 }, uFogNear: { value: 10 }, uFogFar: { value: 100 }, uLight: { value: new THREE.Vector3(-1, 1.25, -1).normalize() },
    },
    vertexShader: `
      attribute float elev; varying float vElev; varying vec3 vN; varying float vDist;
      void main() { vElev = elev; vN = normal; vec4 mv = modelViewMatrix * vec4(position, 1.0); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      uniform vec3 c0, c1, c2, c3, c4, cSea, cInk, cFog, uLight; uniform float uInt, uFogNear, uFogFar;
      varying float vElev; varying vec3 vN; varying float vDist;
      vec3 ramp(float m) {
        if (m < 800.0) return mix(c0, c1, clamp(m / 800.0, 0.0, 1.0));
        if (m < 1800.0) return mix(c1, c2, (m - 800.0) / 1000.0);
        if (m < 2700.0) return mix(c2, c3, (m - 1800.0) / 900.0);
        return mix(c3, c4, clamp((m - 2700.0) / 700.0, 0.0, 1.0));
      }
      float lines(float f, float lo, float hi) { float w = fwidth(f); float d = abs(fract(f - 0.5) - 0.5) / max(w, 1e-5); return (1.0 - smoothstep(lo, hi, d)) * (1.0 - smoothstep(0.25, 0.55, w)); }
      void main() {
        vec3 n = normalize(vN);
        vec3 col = vElev <= 0.5 ? cSea : mix(ramp(vElev), c3, smoothstep(0.55, 0.2, n.y) * 0.5);
        col *= 0.5 + 0.62 * max(dot(n, uLight), 0.0);
        if (vElev > 0.5) col = mix(col, cInk, max(lines(vElev / uInt, 0.5, 1.3) * 0.22, lines(vElev / (uInt * 5.0), 1.0, 2.0) * 0.42));
        gl_FragColor = vec4(mix(col, cFog, smoothstep(uFogNear, uFogFar, vDist)), 1.0);
      }`,
  });
  const routeMat = new THREE.MeshBasicMaterial({ fog: true }), restMat = new THREE.MeshBasicMaterial({ fog: true, transparent: true, opacity: 0.4 });
  const markMat = new THREE.MeshBasicMaterial({ fog: false }), stemMat = new THREE.MeshBasicMaterial({ fog: true });

  function theme() {
    const u = terrainMat.uniforms;
    ["r0", "r1", "r2", "r3", "r4"].forEach((t, i) => u["c" + i].value.set(css("--" + t)));
    u.cSea.value.set(css("--sea")); u.cInk.value.set(css("--contour")); u.cFog.value.set(css("--sky"));
    scene.fog.color.set(css("--sky")); renderer.setClearColor(css("--sky"));
    routeMat.color.set(css("--today")); markMat.color.set(css("--today")); restMat.color.set(css("--route-rest")); stemMat.color.set(css("--ink"));
    drawProfile();
  }

  // ---- one day's world --------------------------------------------------
  let W = null; // the current world
  const group = new THREE.Group(); scene.add(group);
  const labelBox = $("labels");

  function build(item) {
    while (group.children.length) { const m = group.children.pop(); m.geometry?.dispose(); }
    labelBox.textContent = "";
    const g = item.grid, h = decode(g), lat0 = (g.s + g.n) / 2, lon0 = (g.w + g.e) / 2, kmLon = 111.32 * Math.cos(lat0 * Math.PI / 180);
    const wKm = (g.e - g.w) * kmLon, hKm = (g.n - g.s) * KM_LAT, span = Math.max(wKm, hKm);
    const exag = clamp(Math.sqrt(span / 12), 1.5, 8), yOf = (m) => (m - g.min) / 1000 * exag;
    const X = (lon) => (lon - lon0) * kmLon, Z = (lat) => (lat0 - lat) * KM_LAT;
    const elevAt = (x, z) => {
      const fx = clamp((x + wKm / 2) / wKm * (g.nx - 1), 0, g.nx - 1.001), fy = clamp((z + hKm / 2) / hKm * (g.ny - 1), 0, g.ny - 1.001);
      const i = Math.floor(fx), j = Math.floor(fy), tx = fx - i, ty = fy - j, a = j * g.nx + i;
      return (h[a] * (1 - tx) + h[a + 1] * tx) * (1 - ty) + (h[a + g.nx] * (1 - tx) + h[a + g.nx + 1] * tx) * ty;
    };

    const pos = new Float32Array(g.nx * g.ny * 3), idx = [];
    for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) {
      const k = (j * g.nx + i) * 3;
      pos[k] = -wKm / 2 + wKm * i / (g.nx - 1); pos[k + 1] = yOf(h[j * g.nx + i]); pos[k + 2] = -hKm / 2 + hKm * j / (g.ny - 1);
      if (i < g.nx - 1 && j < g.ny - 1) { const a = j * g.nx + i, b = a + 1, c = a + g.nx, d = c + 1; idx.push(a, c, b, b, c, d); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("elev", new THREE.BufferAttribute(h, 1));
    geo.setIndex(idx); geo.computeVertexNormals();
    group.add(new THREE.Mesh(geo, terrainMat));

    // Resample a lon/lat line to evenly spaced points draped on the terrain.
    const drape = (line, n, lift) => {
      const pts = line.map(([lon, lat]) => [X(lon), Z(lat)]), cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const len = cum[cum.length - 1], out = [], el = [];
      for (let s = 0, i = 0; s < n; s++) {
        const d = len * s / (n - 1);
        while (i < pts.length - 2 && cum[i + 1] < d) i++;
        const t = cum[i + 1] > cum[i] ? (d - cum[i]) / (cum[i + 1] - cum[i]) : 0, x = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, z = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, m = elevAt(x, z);
        out.push(new THREE.Vector3(x, yOf(m) + lift, z)); el.push(m);
      }
      return { pts: out, el, len };
    };
    class Poly extends THREE.Curve { constructor(p) { super(); this.p = p; } getPoint(u, t = new THREE.Vector3()) { const f = clamp(u, 0, 1) * (this.p.length - 1), i = Math.min(Math.floor(f), this.p.length - 2); return t.copy(this.p[i]).lerp(this.p[i + 1], f - i); } }
    const tube = (pts, r, mat) => { const m = new THREE.Mesh(new THREE.TubeGeometry(new Poly(pts), pts.length - 1, r, 5, false), mat); group.add(m); return m; };

    const w = { item, span, exag, elevAt, yOf, wKm, hKm, labels: [], orbit: true, dist: span * 0.55, centre: new THREE.Vector3(0, 0, 0), profile: null, km: 0 };
    if (item.overview) {
      for (const d of DATA.days) { const n = clamp(Math.round(d.line.length / 2), 2, 400); tube(drape(d.line, n, span * 0.004).pts, span * 0.0022, routeMat); }
      w.dist = span * 0.62; w.duration = 40;
    } else {
      const km = item.km;
      w.km = km;
      if (km >= 4) {
        const dist = clamp(km * 0.085, 4, 60), r = dist * 0.0055, n = clamp(Math.round(km / (dist * 0.02)), 200, 3600);
        const path = drape(item.line, n, r * 1.6);
        w.orbit = false; w.dist = dist; w.pts = path.pts; w.profile = path.el; w.duration = clamp(12 + km / 7, 16, 70);
        // The camera follows a smoothed copy, so switchbacks don't whip it around.
        const win = Math.max(2, Math.round(n * dist * 0.35 / km)), sm = [];
        for (let i = 0; i < n; i++) { const a = Math.max(0, i - win), b = Math.min(n - 1, i + win), v = new THREE.Vector3(); for (let k = a; k <= b; k++) v.add(path.pts[k]); sm.push(v.multiplyScalar(1 / (b - a + 1))); }
        w.smooth = sm; w.lead = win;
        tube(path.pts, r * 0.8, restMat);
        w.done = tube(path.pts, r, routeMat); w.segIdx = 5 * 6;
        w.marker = new THREE.Mesh(new THREE.SphereGeometry(r * 2.6, 16, 12), markMat); group.add(w.marker);
      } else {
        // A hiking or rest day: the road line is a few hundred yards, so circle the place instead.
        const c = item.pins.length ? item.pins : item.line.map(([lon, lat]) => ({ lon, lat }));
        const cx = c.reduce((s, p) => s + X(p.lon), 0) / c.length, cz = c.reduce((s, p) => s + Z(p.lat), 0) / c.length;
        w.centre.set(cx, yOf(elevAt(cx, cz)), cz); w.dist = clamp(span * 0.42, 5, 14); w.duration = 18;
        if (item.line.length > 1) tube(drape(item.line, 40, 0.02).pts, w.dist * 0.006, routeMat);
      }
    }
    terrainMat.uniforms.uInt.value = [10, 20, 40, 50, 100, 200, 250, 500].find((s) => s >= w.dist * 5) ?? 1000;
    const stemH = w.dist * 0.09;
    for (const p of item.pins) {
      const x = X(p.lon), z = Z(p.lat);
      if (Math.abs(x) > wKm / 2 || Math.abs(z) > hKm / 2) continue;
      const y = yOf(elevAt(x, z)), stem = new THREE.Mesh(new THREE.CylinderGeometry(w.dist * 0.0016, w.dist * 0.0016, stemH, 5), stemMat);

      const el = document.createElement("div"); el.className = "label" + (p.camp ? " camp" : ""); el.textContent = p.name; labelBox.appendChild(el);

    camera.far = span * 4; camera.near = Math.max(0.02, w.dist * 0.02); camera.updateProjectionMatrix();
    const fogFar = item.overview ? span * 3 : Math.max(w.dist * 14, span * 0.9), fogNear = fogFar * 0.35;
    scene.fog.near = fogNear; scene.fog.far = fogFar; terrainMat.uniforms.uFogNear.value = fogNear; terrainMat.uniforms.uFogFar.value = fogFar;
    return w;
  }

  // ---- state and camera -------------------------------------------------
  const S = { i: 0, u: 0, playing: false, speed: 1, yaw: 0, pitch: 0.62, zoom: 1, heading: null };
  const camPos = new THREE.Vector3(), camAt = new THREE.Vector3(), tmp = new THREE.Vector3();
  let snap = true;

  function place(dt) {
    const w = W, target = new THREE.Vector3(); let heading;
    if (w.orbit) { target.copy(w.centre); heading = (w.item.overview ? -0.35 : 0.6) + S.u * (w.item.overview ? 0.9 : Math.PI * 2); }
    else {
      const f = S.u * (w.pts.length - 1), i = Math.min(Math.floor(f), w.pts.length - 2);
      w.marker.position.copy(w.pts[i]).lerp(w.pts[i + 1], f - i);
      w.done.geometry.setDrawRange(0, Math.max(1, i) * w.segIdx);
      target.copy(w.smooth[i]).lerp(w.smooth[i + 1], f - i);
      const a = w.smooth[Math.max(0, i - w.lead)], b = w.smooth[Math.min(w.pts.length - 1, i + w.lead * 2)];
      heading = Math.atan2(b.x - a.x, -(b.z - a.z));
    }

    else { let d = heading - S.heading; d = Math.atan2(Math.sin(d), Math.cos(d)); S.heading += d * Math.min(1, dt * 1.6); }
    const yaw = S.heading + S.yaw, dist = w.dist * S.zoom, pitch = w.orbit ? clamp(S.pitch + 0.12, 0.2, 1.4) : S.pitch;
    tmp.set(target.x - Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    tmp.y = Math.max(tmp.y, w.yOf(w.elevAt(tmp.x, tmp.z)) + dist * 0.12);
    const k = snap ? 1 : Math.min(1, dt * 3.2);
    camPos.lerp(tmp, k); camAt.lerp(target, snap ? 1 : Math.min(1, dt * 5));
    camera.position.copy(camPos); camera.lookAt(camAt); snap = false;
  }

  function labels() {
    const vw = innerWidth, vh = innerHeight, taken = [], order = [...W.labels].sort((a, b) => (b.camp - a.camp) || a.at.distanceTo(camera.position) - b.at.distanceTo(camera.position));
    const top = 96, bottom = vh - 80;
    for (const l of order) {
      tmp.copy(l.at).project(camera);
      const x = (tmp.x + 1) / 2 * vw, y = (1 - tmp.y) / 2 * vh - 4, far = l.at.distanceTo(camera.position) > scene.fog.far * 0.8;
      const box = [x - l.w / 2 - 4, y - 26, x + l.w / 2 + 4, y];
      const ok = tmp.z < 1 && !far && box[0] > 4 && box[2] < vw - 4 && box[1] > top && box[3] < bottom && !taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1]);
      l.el.hidden = !ok;
      if (ok) { taken.push(box); l.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`; }
    }
  }

  // ---- UI ---------------------------------------------------------------
  const pc = $("profile"), pctx = pc.getContext("2d");
  function drawProfile() {
    if (!W) return;
    const r = pc.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    if (!r.width) return;
    pc.width = r.width * d; pc.height = r.height * d; pctx.setTransform(d, 0, 0, d, 0, 0); pctx.clearRect(0, 0, r.width, r.height);
    const x = S.u * r.width, base = r.height - 6;
    pctx.strokeStyle = css("--line"); pctx.lineWidth = 1; pctx.beginPath(); pctx.moveTo(0, base + .5); pctx.lineTo(r.width, base + .5); pctx.stroke();
    if (W.profile) {
      const e = W.profile, lo = Math.min(...e), hi = Math.max(...e), yv = (m) => base - 2 - (m - lo) / Math.max(40, hi - lo) * (base - 8);
      const trace = () => { pctx.beginPath(); pctx.moveTo(0, base); for (let i = 0; i < e.length; i++) pctx.lineTo(i / (e.length - 1) * r.width, yv(e[i])); pctx.lineTo(r.width, base); pctx.closePath(); };
      trace(); pctx.fillStyle = css("--line"); pctx.fill();
      pctx.save(); pctx.beginPath(); pctx.rect(0, 0, x, r.height); pctx.clip(); trace(); pctx.fillStyle = css("--today"); pctx.fill(); pctx.restore();
    } else { pctx.fillStyle = css("--today"); pctx.fillRect(0, base - 3, x, 3); }
    pctx.fillStyle = css("--ink"); pctx.fillRect(Math.round(x) - 1, 2, 2, base - 2);
  }
  function readout() {
    const w = W;
    if (w.profile) { const m = w.profile[Math.round(S.u * (w.profile.length - 1))]; $("now").textContent = `mile ${(S.u * w.km * MI).toFixed(0)} · ${Math.round(m * FT / 10) * 10} ft`.replace(/(\d)(?=(\d{3})+ ft)/, "$1,"); }
    else $("now").textContent = w.item.overview ? `${Math.round(totalKm * MI).toLocaleString()} mi drawn` : "circling camp";
    $("seek").value = Math.round(S.u * 1000);
    drawProfile();
  }
  function setPlaying(p) { S.playing = p; $("playIcon").setAttribute("d", p ? "M4 3h4v14H4zM12 3h4v14h-4z" : "M5 3l12 7-12 7z"); $("play").setAttribute("aria-label", p ? "Pause" : "Play"); }
  function go(i, keepPlaying) {
    S.i = (i + items.length) % items.length; S.u = 0; S.yaw = 0; S.zoom = 1; snap = true;
    const it = items[S.i]; W = build(it);
    $("trip").textContent = DATA.title;
    $("title").textContent = it.overview ? it.title : `Day ${it.day} · ${it.title}`;
    $("meta").textContent = it.overview
      ? `${DATA.days.length} days with a line · vertical ×${W.exag.toFixed(1)}`
      : `${fmtDate(it.date)} · ${it.km >= 4 ? Math.round(it.km * MI) + " mi" : "on foot from camp"}${it.shape === "road" ? "" : " · straight lines between stops, no road line yet"} · vertical ×${W.exag.toFixed(1)}`;
    document.querySelectorAll("#days button").forEach((b, k) => b.setAttribute("aria-current", String(k === S.i)));
    try { history.replaceState(null, "", it.overview ? "#route" : "#day-" + it.day); } catch {}
    if (!keepPlaying) setPlaying(false);
    place(0); readout();
  }

  $("trip").textContent = DATA.title;
  $("credit").textContent = `Terrain: ${DATA.terrain}. Roads: ${DATA.roads}. Elevations are the terrain model's, for drawing only. Days without a line (flights, days with no placed stops) are left out. Built ${DATA.built}.`;
  items.forEach((it, i) => {
    const li = document.createElement("li"), b = document.createElement("button"); b.type = "button";
    const cell = (c, t) => { const s = document.createElement("span"); s.className = c; s.textContent = t; b.appendChild(s); };
    cell("d", it.overview ? "All" : "Day " + it.day); cell("t", it.title); cell("mi", it.overview ? "" : it.km >= 4 ? Math.round(it.km * MI) + " mi" : "camp");
    b.onclick = () => { go(i, false); setPlaying(true); toggle(false); }; li.appendChild(b); $("days").appendChild(li);
  });
  const toggle = (open) => { $("drawer").hidden = !open; $("open").setAttribute("aria-expanded", String(open)); if (open) $("close").focus(); };
  $("open").onclick = () => toggle($("drawer").hidden); $("close").onclick = () => { toggle(false); $("open").focus(); };
  $("play").onclick = () => { if (!S.playing && S.u >= 1) S.u = 0; setPlaying(!S.playing); };
  $("prev").onclick = () => go(S.i - 1, S.playing); $("next").onclick = () => go(S.i + 1, S.playing);
  $("seek").oninput = (e) => { S.u = e.target.value / 1000; snap = true; place(0); readout(); };
  const speeds = [0.5, 1, 2, 4];
  $("speed").onclick = () => { S.speed = speeds[(speeds.indexOf(S.speed) + 1) % speeds.length]; $("speed").textContent = S.speed + "×"; };
  addEventListener("keydown", (e) => {
    if (e.target.closest("input, button")) { if (e.key === "Escape") toggle(false); return; }
    if (e.key === " ") { e.preventDefault(); $("play").click(); } else if (e.key === "ArrowRight") $("next").click(); else if (e.key === "ArrowLeft") $("prev").click(); else if (e.key === "Escape") toggle(false);
  });

  // Drag turns the camera, wheel or pinch zooms.
  const cv = renderer.domElement, ptrs = new Map(); let pinch = 0;
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
  cv.addEventListener("pointermove", (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) { S.yaw -= (e.clientX - p[0]) * 0.006; S.pitch = clamp(S.pitch + (e.clientY - p[1]) * 0.005, 0.12, 1.35); }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) S.zoom = clamp(S.zoom * pinch / d, 0.35, 5); pinch = d; }
  });
  const up = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", (e) => { e.preventDefault(); S.zoom = clamp(S.zoom * Math.exp(e.deltaY * 0.0012), 0.35, 5); }, { passive: false });

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); drawProfile(); }
  addEventListener("resize", resize);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
  new MutationObserver(theme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  let last = performance.now(), shown = -1;
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    if (S.playing) {
      S.u += dt * S.speed / W.duration;
      if (S.u >= 1) { if (S.i < items.length - 1) go(S.i + 1, true); else { S.u = 1; setPlaying(false); } }
    }
    place(dt); renderer.render(scene, camera); labels();
    const tick = Math.round(S.u * 400); if (tick !== shown) { shown = tick; readout(); }
    requestAnimationFrame(frame);
  }

  resize(); theme();
  const fromHash = () => { const m = location.hash.match(/^#day-(\d+)$/); const i = m ? items.findIndex((it) => it.day === +m[1]) : 0; return i < 0 ? 0 : i; };
  go(fromHash(), false);
  addEventListener("hashchange", () => { const i = fromHash(); if (i !== S.i) go(i, S.playing); });
  setPlaying(!matchMedia("(prefers-reduced-motion: reduce)").matches);
  requestAnimationFrame(frame);
})();
</script>

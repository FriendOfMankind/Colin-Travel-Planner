# The bucket list: single places worth going out of the way for, too small to
# be a trip on their own. Potential trips live in wishlist/, dated trips in
# trips/. Schema and rules: tools/lib/bucket.mjs (tested by npm test).
#
# - kind: hike walk view waterfall lake swim river campground city ruin cave
#         geology wildlife fossil food drive other
# - status: want | done | dropped. done needs trip: (or when:), dropped needs reason:
# - state: two-letter state/province code. where: the human version
# - wishlist: / trip: point at the idea or trip the item belongs to. The facts
#   stay there; `why` is one line, never a second copy of a price, hour or rule
# - no coordinates here, ever. Places are located in a trip's places.yaml
# - verdict: optional, for done items, in Colin's words
note: Seeded 2026-09-30 from the trip logs, the trips, the wishlist, and the lists that used to sit in me/adventures.md (fossil leads) and me/travel-style.md (city walks). Colin fills in the done gaps.


# share/proposals.yaml — every invite page Colin has made for people joining a trip.
#
# One row per page. The page itself is a claude.ai artifact (private until
# Colin shares it). Two formats:
#   page  an HTML page; its source is share/proposals/<id>.html. Edit the
#         source, then publish it to the SAME url (Artifact tool, `url`), and
#         set asOf to today. Never publish a copy as a new page.
#   doc   a Claude Docs doc; its words live in the Docs service, not here.
#         Edit it through the Claude Docs connector.
#
# Fields
#   id       short slug, also the source file's name
#   title    the page's own title
#   url      the claude.ai link
#   format   page | doc
#   source   share/proposals/<id>.html (pages only)
#   also     optional: more trip slugs, for a page that covers several trips
#            (it shows on each trip's page and checks each trip's log)
#   trip / wishlist   the plan it's built from (one or both); the briefing
#            compares the page's date against that plan's newest change
#   for      who it's pitched to, in plain words
#   status   draft (not sent) | sent (waiting on answers) | in (they said yes)
#            | out (they said no) | parked (idea on hold, page kept)
#            | superseded (replaced; `by:` names the replacement) | unknown
#   asOf     the date the page's content is as of (its footer says the same)
#   checked  optional: the date someone re-read the page against the plan and
#            found it still right, without republishing
#   stale    optional: a known mismatch with the plan, in one line, until fixed
#   note     optional, one line
#
# The briefing (tools/now.mjs) lists live rows (draft, sent, in, unknown) whose
# plan changed after max(asOf, checked). tools/test/proposals.test.mjs checks
# the shape, and that every source file exists and every page has a row.

